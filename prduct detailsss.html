<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fangam Organic Catalog</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 70px;
        }

        .header {
            background: #2c5e3b;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
            background: #fff;
        }

        .header-title h1 { font-size: 1.3rem; letter-spacing: 0.5px; }
        .header-title p { font-size: 0.8rem; opacity: 0.85; }

        .lang-switcher select {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: #ffffff;
            color: #2c5e3b;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            max-width: 180px;
        }

        .main-content { padding: 20px 15px; }

        .section-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .section-title h2 { font-size: 1.4rem; color: #2c5e3b; margin-bottom: 5px; }
        .section-title p { color: #666; font-size: 0.9rem; }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .cat-card {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cat-card:hover {
            border-color: #2c5e3b;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(44,94,59,0.12);
        }

        .cat-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #eee;
        }

        .cat-card h3 {
            font-size: 1.2rem;
            color: #2c5e3b;
            margin-bottom: 10px;
        }

        .explore-btn {
            background: #2c5e3b;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: auto;
        }

        .admin-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c5e3b;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            float: right;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            color: #e74c3c;
            background: #fde8e8;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title {
            color: #2c5e3b;
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .items-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .item-card {
            background: #fdfdfd;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .item-card img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #eee;
            flex-shrink: 0;
        }

        .item-info h4 { font-size: 1rem; color: #333; margin-bottom: 4px; }
        .item-info p { font-size: 0.85rem; color: #666; line-height: 1.3; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 600; color: #444; margin-bottom: 4px; font-size: 0.85rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }
        .submit-btn {
            background: #2c5e3b;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>

        <div class="main-content">

            <div class="category-grid">

                    <h3 id="catTitleSeeds">Seeds</h3>
                    <button class="explore-btn" id="btnExploreSeeds">Explore Seeds</button>
                </div>

                <div class="cat-card" onclick="openCategory('Base Oils')">
                    <img src="https://images.unsplash.com/photo-1608248597359-f584742f9b84?w=400" alt="Base Oils">
                    <h3 id="catTitleOils">Base Oils</h3>
                    <button class="explore-btn" id="btnExploreOils">Explore Base Oils</button>
                </div>

                <div class="cat-card" onclick="openCategory('Herbs')">
                    <img src="https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=400" alt="Herbs">
                    <h3 id="catTitleHerbs">Herbs</h3>
                    <button class="explore-btn" id="btnExploreHerbs">Explore Herbs</button>
                </div>
            </div>
        </div>
    </div>

    <div class="admin-trigger" onclick="promptPassword()" title="Admin Panel">⚙</div>

    <div class="modal" id="categoryModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal('categoryModal')">&times;</span>
            <h2 class="modal-title" id="modalCategoryTitle">Category Items</h2>
            <div class="items-grid" id="itemsGridContainer"></div>
        </div>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-box" style="max-width: 400px;">
            <span class="close-btn" onclick="closeModal('adminModal')">&times;</span>
            <h2 class="modal-title" id="adminPanelTitle">Admin Panel</h2>
            
            <div class="form-group">
                <label id="lblCatSelect">Select Category:</label>
                <select id="adminCategory">
                    <option value="Seeds">Seeds</option>
                    <option value="Base Oils">Base Oils</option>
                    <option value="Herbs">Herbs</option>
                </select>
            </div>

            <div class="form-group">
                <label id="lblProdName">Product Name:</label>
                <input type="text" id="adminName" placeholder="e.g. Kalonji Seeds">
            </div>

            <div class="form-group">
                <label id="lblDesc">Description:</label>
                <textarea id="adminDesc" rows="3" placeholder="Enter details..."></textarea>
            </div>

            <div class="form-group">
                <label id="lblImg">Upload Product Image:</label>
                <input type="file" id="adminImageFile" accept="image/*">
            </div>

            <button class="submit-btn" id="btnSaveProd" onclick="saveProductItem()">Save & Publish Product</button>
        </div>
    </div>

    let database = [
        { category: "Seeds", name: "Kalonji Seeds", description: "High quality pure black seeds for organic formulation.", image: "https://images.unsplash.com/photo-1599940824399-b87987ceb72a?w=300" },
        { category: "Base Oils", name: "Pure Sesame Oil", description: "Rich organic base oil for deep hair nourishment.", image: "https://images.unsplash.com/photo-1608248597359-f584742f9b84?w=300" },
        { category: "Herbs", name: "Amla Powder", description: "Natural herbal extract for strong and dark hair roots.", image: "https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=300" }
    ];

    function switchLanguage() {
        const lang = document.getElementById('langSelect').value;
        const t = translations[lang] || translations['en'];
        const htmlRoot = document.getElementById('htmlRoot');

        if(t.rtl) {
            htmlRoot.setAttribute('dir', 'rtl');
            htmlRoot.setAttribute('lang', lang);
        } else {
            htmlRoot.setAttribute('dir', 'ltr');
            htmlRoot.setAttribute('lang', lang);
        }

        document.getElementById('txtBrandName').innerText = t.brandName;
        document.getElementById('txtTagline').innerText = t.tagline;
        document.getElementById('txtWelcomeTitle').innerText = t.welcomeTitle;
        document.getElementById('txtWelcomeSub').innerText = t.welcomeSub;

        document.getElementById('catTitleSeeds').innerText = t.seedsTitle;
        document.getElementById('catTitleOils').innerText = t.oilsTitle;
        document.getElementById('catTitleHerbs').innerText = t.herbsTitle;

        document.getElementById('btnExploreSeeds').innerText = t.exploreBtn;
        document.getElementById('btnExploreOils').innerText = t.exploreBtn;
        document.getElementById('btnExploreHerbs').innerText = t.exploreBtn;

        document.getElementById('adminPanelTitle').innerText = t.adminTitle;
        document.getElementById('lblCatSelect').innerText = t.catLabel;
        document.getElementById('lblProdName').innerText = t.nameLabel;
        document.getElementById('lblDesc').innerText = t.descLabel;
        document.getElementById('lblImg').innerText = t.imgLabel;
        document.getElementById('btnSaveProd').innerText = t.saveBtn;
    }

    function promptPassword() {
        let pass = prompt("Enter Admin Password:");
        if (pass === "1234") {
            document.getElementById('adminModal').style.display = "flex";
        } else if (pass !== null) {
            alert("Incorrect Password!");
        }
    }

    function openCategory(categoryName) {
        const modal = document.getElementById('categoryModal');
        const title = document.getElementById('modalCategoryTitle');
        const grid = document.getElementById('itemsGridContainer');

        title.innerText = categoryName + " Collection";
        grid.innerHTML = "";

        const filtered = database.filter(item => item.category === categoryName);

        if (filtered.length === 0) {
            grid.innerHTML = "<p style='text-align: center; color: #777; padding: 20px;'>No items available in this category yet.</p>";
        } else {
            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="item-card">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-info">
                            <h4>${item.name}</h4>
                            <p>${item.description}</p>
                        </div>
                    </div>
                `;
            });
        }

        modal.style.display = "flex";
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = "none";
    }

    function saveProductItem() {
        const category = document.getElementById('adminCategory').value;
        const name = document.getElementById('adminName').value;
        const description = document.getElementById('adminDesc').value;
        const fileInput = document.getElementById('adminImageFile');

        if (!name || !description) {
            alert("Please fill in both the product name and description fields.");
            return;
        }

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                database.push({
                    category: category,
                    name: name,
                    description: description,
                    image: e.target.result
                });

                alert("Product successfully added to " + category + "!");
                closeModal('adminModal');

                document.getElementById('adminName').value = "";
                document.getElementById('adminDesc').value = "";
                document.getElementById('adminImageFile').value = "";
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            alert("Please choose an image file to upload.");
        }
    }
</script>
