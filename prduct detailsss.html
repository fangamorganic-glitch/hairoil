<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Ingredients Catalog</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* Mobile Screen Container */
        .mobile-screen {
            width: 100%;
            max-width: 400px;
            height: 85vh;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #333;
        }

        /* Header */
        .app-header {
            background: #2c5e3b;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Content Area */
        .app-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f9f9f9;
        }

        /* Category Selection Buttons */
        .category-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .cat-btn {
            background: #ffffff;
            border: 2px solid #2c5e3b;
            color: #2c5e3b;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .cat-btn:hover {
            background: #2c5e3b;
            color: white;
        }

        /* Hidden Secret Button on Side */
        .secret-trigger {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 15px;
            height: 15px;
            background: rgba(0,0,0,0.1);
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
        }
        .secret-trigger:hover { background: #2c5e3b; }

        /* Popup Modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-height: 80vh;
            border-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-modal {
            float: right;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            color: #ff5e5e;
        }

        /* Product Cards inside Popup */
        .product-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .product-card img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .product-info h4 { font-size: 1rem; color: #333; margin-bottom: 5px; }
        .product-info p { font-size: 0.85rem; color: #666; }

        .back-home-btn {
            background: #666;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="mobile-screen">
        <!-- خفیہ سائیڈ بٹن -->
        <div class="secret-trigger" onclick="openSecretAdmin()" title="Admin Area"></div>

        <!-- ہیڈر -->
        <div class="app-header">
            Natural Ingredients
        </div>

        <!-- مین باڈی جہاں تین کیٹگریز کے بٹن ہوں گے -->
        <div class="app-body" id="mainBody">
            <div style="text-align: center; margin: 20px 0; color: #555;">
                <h3>خوش آمدید!</h3>
                <p style="font-size: 0.9rem; margin-top: 5px;">براہ کرم درج ذیل میں سے کیٹگری منتخب کریں:</p>
            </div>

            <div class="category-menu">
                <button class="cat-btn" onclick="openCategory('Seeds')">Seeds (بیج)</button>
                <button class="cat-btn" onclick="openCategory('Base Oils')">Base Oils (بیس آئل)</button>
                <button class="cat-btn" onclick="openCategory('Herbs')">Herbs (ہربز)</button>
            </div>
        </div>
    </div>

    <!-- پاپ اپ ونڈو (مخصوص کیٹگری کا ڈیٹا دکھانے کے لیے) -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <button class="back-home-btn" onclick="closeModal()">← واپس</button>
            <h2 id="modalTitle" style="margin-bottom: 15px; color: #2c5e3b; font-size: 1.3rem;"></h2>
            <div id="productList">
                <!-- پروڈکٹس یہاں جاوا اسکریپٹ کے ذریعے ڈائنامک آئیں گی -->
            </div>
        </div>
    </div>

<script>
    // --- یہاں آپ اپنا گٹ ہب کا ڈیٹا درج کریں گے ---
    // گٹ ہب سے سیدھا تصویر کا "Raw URL" یہاں پیسٹ کرتے جائیں
    const database = [
        {
            category: "Seeds",
            name: "کلونجی (Kalonji Seeds)",
            description: "خالص اور اعلیٰ معیار کے سیاہ بیج۔",
            image: "https://raw.githubusercontent.com/آپکا_یوزر_نام/آپکی_ریپوزیٹری_کا_نام/main/images/kalonji.jpg"
        },
        {
            category: "Seeds",
            name: "میتھی دانہ (Fenugreek Seeds)",
            description: "بالوں اور صحت کے لیے بہترین بیج۔",
            image: "https://raw.githubusercontent.com/آپکا_یوزر_نام/آپکی_ریپوزیٹری_کا_نام/main/images/methi.jpg"
        },
        {
            category: "Base Oils",
            name: "تل کا تیل (Sesame Oil)",
            description: "آرگینک اور خالص بیس آئل۔",
            image: "https://raw.githubusercontent.com/آپکا_یوزر_نام/آپکی_ریپوزیٹری_کا_نام/main/images/sesame.jpg"
        },
        {
            category: "Herbs",
            name: "آملہ پاؤڈر (Amla Powder)",
            description: "قدرتی جڑی بوٹی برائے بالوں کی مضبوطی۔",
            image: "https://raw.githubusercontent.com/آپکا_یوزر_نام/آپکی_ریپوزیٹری_کا_نام/main/images/amla.jpg"
        }
    ];

    function openCategory(catName) {
        const modal = document.getElementById('categoryModal');
        const modalTitle = document.getElementById('modalTitle');
        const productList = document.getElementById('productList');

        modalTitle.innerText = "کیٹگری: " + catName;
        productList.innerHTML = "";

        // اس کیٹگری کا ڈیٹا فلٹر کریں
        const filteredItems = database.filter(item => item.category === catName);

        if(filteredItems.length === 0) {
            productList.innerHTML = "<p style='text-align:center; color:#777;'>اس کیٹگری میں فی الحال کوئی آئٹم موجود نہیں ہے۔</p>";
        } else {
            filteredItems.forEach(item => {
                productList.innerHTML += `
                    <div class="product-card">
                        <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/70?text=No+Image'">
                        <div class="product-info">
                            <h4>${item.name}</h4>
                            <p>${item.description}</p>
                        </div>
                    </div>
                `;
            });
        }

        modal.style.display = "flex";
    }

    function closeModal() {
        document.getElementById('categoryModal').style.display = "none";
    }

    function openSecretAdmin() {
        alert("خفیہ ایڈمن ایریا: یہاں آپ نیا آئٹم کوڈ میں شامل کر سکتے ہیں یا گوگل شیٹ کی طرح فارمیٹ بنا سکتے ہیں۔");
    }
</script>

</body>
</html>
