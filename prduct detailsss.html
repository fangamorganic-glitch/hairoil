<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fangam Organic Catalog</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }

        /* Full Screen Desktop Wrapper */
        .container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }

        /* Header */
        .header {
            background: #2c5e3b;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 { font-size: 2.2rem; margin-bottom: 8px; letter-spacing: 1px; }
        .header p { font-size: 1rem; opacity: 0.9; }

        /* Main Content Layout */
        .main-content {
            padding: 40px 30px;
            flex: 1;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .section-title h2 { font-size: 1.6rem; color: #2c5e3b; margin-bottom: 5px; }
        .section-title p { color: #666; font-size: 0.95rem; }

        /* Category Cards Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .cat-card {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cat-card:hover {
            border-color: #2c5e3b;
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(44,94,59,0.15);
        }

        .cat-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #eee;
        }

        .cat-card h3 {
            font-size: 1.4rem;
            color: #2c5e3b;
            margin-bottom: 10px;
        }

        .explore-btn {
            background: #2c5e3b;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: auto;
        }
        .cat-card:hover .explore-btn { background: #1e3f27; }

        /* Secret Bottom-Right Admin Logo/Button */
        .admin-trigger {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #2c5e3b;
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            z-index: 100;
        }
        .admin-trigger:hover { transform: scale(1.1); }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 20px;
            padding: 30px;
            overflow-y: auto;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            float: right;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            color: #e74c3c;
            background: #fde8e8;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title {
            color: #2c5e3b;
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Items Display Grid inside Category Modal */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .item-card {
            background: #fdfdfd;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .item-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #eee;
        }

        .item-card h4 { font-size: 1.1rem; color: #333; margin-bottom: 5px; }
        .item-card p { font-size: 0.85rem; color: #666; line-height: 1.3; }

        /* Admin Form Inputs */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #2c5e3b;
        }

        .submit-btn {
            background: #2c5e3b;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover { background: #1e3f27; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Fangam Organic</h1>
            <p>Pure & Natural Herbal Products Catalog</p>
        </div>

        <!-- Main Content Section -->
        <div class="main-content">
            <div class="section-title">
                <h2>Welcome to Catalog</h2>
                <p>Select a category below to explore our pure ingredients:</p>
            </div>

            <!-- Categories Grid with Large Professional Layout -->
            <div class="category-grid">
                <!-- Seeds Category -->
                <div class="cat-card" onclick="openCategory('Seeds')">
                    <img src="https://images.unsplash.com/photo-1599940824399-b87987ceb72a?w=400" alt="Seeds">
                    <h3>Seeds (بیج)</h3>
                    <button class="explore-btn">Explore Seeds</button>
                </div>

                <!-- Base Oils Category -->
                <div class="cat-card" onclick="openCategory('Base Oils')">
                    <img src="https://images.unsplash.com/photo-1608248597359-f584742f9b84?w=400" alt="Base Oils">
                    <h3>Base Oils (بیس آئل)</h3>
                    <button class="explore-btn">Explore Base Oils</button>
                </div>

                <!-- Herbs Category -->
                <div class="cat-card" onclick="openCategory('Herbs')">
                    <img src="https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=400" alt="Herbs">
                    <h3>Herbs (ہربز)</h3>
                    <button class="explore-btn">Explore Herbs</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Secret Bottom-Right Admin Trigger Logo -->
    <div class="admin-trigger" onclick="promptPassword()" title="Admin Panel">⚙</div>

    <!-- Category Items Modal Popup -->
    <div class="modal" id="categoryModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal('categoryModal')">&times;</span>
            <h2 class="modal-title" id="modalCategoryTitle">Category Items</h2>
            <div class="items-grid" id="itemsGridContainer">
                <!-- Dynamic Items Inserted Here -->
            </div>
        </div>
    </div>

    <!-- Admin Password & Management Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-box" style="max-width: 450px;">
            <span class="close-btn" onclick="closeModal('adminModal')">&times;</span>
            <h2 class="modal-title">Admin Management Panel</h2>
            
            <div class="form-group">
                <label>Select Category:</label>
                <select id="adminCategory">
                    <option value="Seeds">Seeds</option>
                    <option value="Base Oils">Base Oils</option>
                    <option value="Herbs">Herbs</option>
                </select>
            </div>

            <div class="form-group">
                <label>Product Name:</label>
                <input type="text" id="adminName" placeholder="e.g. Kalonji Seeds">
            </div>

            <div class="form-group">
                <label>Description:</label>
                <textarea id="adminDesc" rows="3" placeholder="Enter details..."></textarea>
            </div>

            <div class="form-group">
                <label>Upload Product Image:</label>
                <input type="file" id="adminImageFile" accept="image/*">
            </div>

            <button class="submit-btn" onclick="saveProductItem()">Save & Publish Product</button>
        </div>
    </div>

<script>
    // Initial Database storage array with sample items
    let database = [
        {
            category: "Seeds",
            name: "Kalonji Seeds",
            description: "High quality pure black seeds for organic formulation.",
            image: "https://images.unsplash.com/photo-1599940824399-b87987ceb72a?w=300"
        },
        {
            category: "Base Oils",
            name: "Pure Sesame Oil",
            description: "Rich organic base oil for deep hair nourishment.",
            image: "https://images.unsplash.com/photo-1608248597359-f584742f9b84?w=300"
        },
        {
            category: "Herbs",
            name: "Amla Powder",
            description: "Natural herbal extract for strong and dark hair roots.",
            image: "https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=300"
        }
    ];

    function promptPassword() {
        let pass = prompt("Enter Admin Password:");
        // Default password set to '1234' (you can change it here easily)
        if (pass === "1234") {
            document.getElementById('adminModal').style.display = "flex";
        } else if (pass !== null) {
            alert("Incorrect Password!");
        }
    }

    function openCategory(categoryName) {
        const modal = document.getElementById('categoryModal');
        const title = document.getElementById('modalCategoryTitle');
        const grid = document.getElementById('itemsGridContainer');

        title.innerText = categoryName + " Collection";
        grid.innerHTML = "";

        const filtered = database.filter(item => item.category === categoryName);

        if (filtered.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #777; padding: 20px;'>No items available in this category yet.</p>";
        } else {
            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="item-card">
                        <img src="${item.image}" alt="${item.name}">
                        <h4>${item.name}</h4>
                        <p>${item.description}</p>
                    </div>
                `;
            });
        }

        modal.style.display = "flex";
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = "none";
    }

    function saveProductItem() {
        const category = document.getElementById('adminCategory').value;
        const name = document.getElementById('adminName').value;
        const description = document.getElementById('adminDesc').value;
        const fileInput = document.getElementById('adminImageFile');

        if (!name || !description) {
            alert("Please fill in both the product name and description fields.");
            return;
        }

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                database.push({
                    category: category,
                    name: name,
                    description: description,
                    image: e.target.result // Auto saves image file data into the array
                });

                alert("Product successfully added to " + category + "!");
                closeModal('adminModal');

                // Clear input fields
                document.getElementById('adminName').value = "";
                document.getElementById('adminDesc').value = "";
                document.getElementById('adminImageFile').value = "";
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            alert("Please choose an image file to upload.");
        }
    }
</script>

</body>
</html>
