<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fangam Organic - Pure Organic Neem Soap</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #07130b;
      --bg-card: #0d2114;
      --border-gold: #c5a059;
      --gold-light: #f3e5ab;
      --neem-primary: #10381d;
      --neem-accent: #2e7d32;
      --text-main: #f0f4f1;
      --text-muted: #a3b8a8;
      --whatsapp: #25D366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* RTL Support for Urdu */
    body.lang-ur {
      direction: rtl;
      text-align: right;
      font-family: 'Noto Nastaliq Urdu', 'Plus Jakarta Sans', sans-serif;
    }

    /* Header & Social Navigation */
    header {
      background: rgba(7, 19, 11, 0.95);
      border-bottom: 1px solid rgba(197, 160, 89, 0.3);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      padding: 12px 24px;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 1px;
    }

    .social-links {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .social-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(197, 160, 89, 0.1);
      border: 1px solid var(--border-gold);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-icon:hover {
      background: var(--border-gold);
      color: var(--bg-dark);
      transform: translateY(-3px);
    }

    /* Language Switcher Button */
    .lang-btn {
      background: linear-gradient(135deg, #10381d, #1e562c);
      border: 1px solid var(--border-gold);
      color: var(--gold-light);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .lang-btn:hover {
      background: var(--border-gold);
      color: var(--bg-dark);
    }

    /* Main Container */
    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Hero Section */
    .hero-section {
      text-align: center;
      margin-bottom: 50px;
    }

    .product-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(46, 125, 50, 0.2);
      border: 1px solid var(--neem-accent);
      color: #81c784;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .product-title {
      font-family: 'Cinzel', serif;
      font-size: 2.8rem;
      color: var(--gold-light);
      margin-bottom: 15px;
    }

    .product-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto 30px;
    }

    /* Product Image Frame */
    .product-image-container {
      width: 100%;
      max-width: 450px;
      height: 380px;
      margin: 0 auto 40px;
      border-radius: 20px;
      background: radial-gradient(circle, rgba(16, 56, 29, 0.6) 0%, rgba(7, 19, 11, 0.9) 100%);
      border: 2px solid var(--border-gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .product-image-container i {
      font-size: 5rem;
      color: var(--neem-accent);
      margin-bottom: 15px;
    }

    .product-image-container span {
      color: var(--gold-light);
      font-weight: 600;
      font-size: 1.1rem;
    }

    /* Order Button (WhatsApp) */
    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff;
      padding: 16px 36px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(37, 211, 102, 0.5);
    }

    /* Content Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      margin-bottom: 50px;
    }
