<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fangam Organic Products & Herbs</title>
    <!-- Official Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'MehrNastaliq';
            src: url('https://cdn.jsdelivr.net/gh/Sharjeel-Anjum/Mehr-Nastaliq-Web@main/MehrNastaliqWeb.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary-green: #1b4332;       
            --secondary-green: #2d6A4f;     
            --light-green: #e8f5e9;         
            --accent-gold: #d4a373;         
            --bg-color: #f4f7f4;            
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #c8d6c9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body[dir="rtl"] {
            text-align: right;
            direction: rtl;
            font-family: 'MehrNastaliq', 'Jameel Noori Nastaleeq', Arial, sans-serif !important;
        }

        body[dir="rtl"] h1, 
        body[dir="rtl"] h2, 
        body[dir="rtl"] h3, 
        body[dir="rtl"] p, 
        body[dir="rtl"] span, 
        body[dir="rtl"] select, 
        body[dir="rtl"] .product-desc,
        body[dir="rtl"] .product-title,
        body[dir="rtl"] .category-title {
            font-family: 'MehrNastaliq', 'Jameel Noori Nastaleeq', Arial, sans-serif !important;
            letter-spacing: 0px !important;
            line-height: 2.2 !important;
        }

        body[dir="ltr"] {
            text-align: left;
            direction: ltr;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            padding-bottom: 60px;
        }

        header {
            text-align: center;
            padding: 45px 20px 25px 20px;
            background: linear-gradient(to bottom, #d8e8dc, var(--bg-color));
            border-bottom: 3px solid var(--secondary-green);
            position: relative;
        }

        .lang-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .lang-container select {
            padding: 8px 18px;
            border-radius: 25px;
            border: 2px solid var(--secondary-green);
            background-color: #fff;
            color: var(--primary-green);
            font-weight: 700;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 10px rgba(27,67,50,0.1);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-green);
            margin-top: 12px;
            font-weight: 700;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .category-section {
            margin-top: 45px;
        }

        .category-title {
            font-size: 1.6rem;
            color: var(--primary-green);
            border-bottom: 3px solid var(--accent-gold);
            padding-bottom: 8px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(27, 67, 50, 0.08);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(27, 67, 50, 0.15);
        }

        .product-img-container {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background-color: var(--light-green);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-img-container img {
            transform: scale(1.04);
        }

        .product-content {
            padding: 22px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 1.3rem;
            color: var(--primary-green);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .product-desc {
            font-size: 1rem;
            color: #384d3b;
            white-space: pre-line;
            flex-grow: 1;
        }

        #secret-admin-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: var(--primary-green);
            border-radius: 50%;
            cursor: pointer;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(27,67,50,0.3);
        }

        #secret-admin-trigger::after {
            content: "🌿";
            font-size: 22px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: ltr !important;
            text-align: left;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--primary-green);
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn-primary { background-color: var(--primary-green); color: #fff; }
        .btn-secondary { background-color: #e2ede5; color: var(--text-color); }
        .loading-spinner { display: none; text-align: center; margin-top: 10px; color: var(--primary-green); font-weight: 600; }

        @media(max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .products-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body dir="ltr" id="mainBody">

    <header>
        <div class="lang-container">
            <select id="languageSelect" onchange="changeLanguage()">
                <option value="en">English (Default)</option>
                <option value="ur">اردو (Urdu - نوری نستعلیق)</option>
                <option value="ar">العربية (Arabic)</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="fa">فارسی (Persian)</option>
                <option value="zh">中文 (Chinese)</option>
                <option value="es">Español (Spanish)</option>
                <option value="fr">Français (French)</option>
                <option value="de">Deutsch (German)</option>
                <option value="tr">Türkçe (Turkish)</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="ru">Русский (Russian)</option>
                <option value="ja">日本語 (Japanese)</option>
                <option value="ko">한국어 (Korean)</option>
                <option value="it">Italiano (Italian)</option>
            </select>
        </div>
        <h1 id="mainTitle">Fangam Organic Products & Herbs</h1>
    </header>

    <div class="container">
        <!-- Base Oils Section -->
        <div class="category-section">
            <h2 class="category-title" id="catTitle1">Base Oils</h2>
            <div class="products-grid" id="grid-base-oils"></div>
        </div>

        <!-- Seeds Section -->
        <div class="category-section">
            <h2 class="category-title" id="catTitle2">Seeds</h2>
            <div class="products-grid" id="grid-seeds"></div>
        </div>

        <!-- Herbs Section -->
        <div class="category-section">
            <h2 class="category-title" id="catTitle3">Herbs</h2>
            <div class="products-grid" id="grid-herbs"></div>
        </div>
    </div>

    <!-- Secret Admin Trigger -->
    <div id="secret-admin-trigger" onclick="openPasswordModal()"></div>

    <!-- Password Modal -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-content" style="max-width: 380px;">
            <h2>Admin Authentication</h2>
            <div class="form-group">
                <label>Enter Admin Password</label>
                <input type="password" id="adminPasswordInput" placeholder="Password">
            </div>
            <div class="modal-btns">
                <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                <button class="btn btn-primary" onclick="verifyPassword()">Login</button>
            </div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <h2>Add New Product / Herb</h2>
            <form id="productForm" onsubmit="handleProductSubmit(event)">
                <div class="form-group">
                    <label>Category</label>
                    <select id="productCategory" required>
                        <option value="base-oils">Base Oils</option>
                        <option value="seeds">Seeds</option>
                        <option value="herbs">Herbs</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Product Name (English)</label>
                    <input type="text" id="productName" required placeholder="e.g. Coconut Oil">
                </div>
                <div class="form-group">
                    <label>Description (English)</label>
                    <textarea id="productDesc" required placeholder="Enter description..."></textarea>
                </div>
                <div class="form-group">
                    <label>Product Image</label>
                    <input type="file" id="productImageFile" accept="image/*" required onchange="encodeImageFileAsURL(this)">
                    <input type="hidden" id="productImageBase64">
                </div>
                <div class="loading-spinner" id="loadingSpinner">Saving...</div>
                <div class="modal-btns">
                    <button type="button" class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save & Publish</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                mainTitle: "Fangam Organic Products & Herbs",
                cat1: "Base Oils",
                cat2: "Seeds",
                cat3: "Herbs",
                products: {
                    'Mustard Oil': {
                        name: 'Mustard Oil',
                        desc: 'Effect on Hair: Mustard oil is a heavy, warming, and deeply penetrating oil. Stimulates blood circulation, promotes natural growth, and prevents dandruff.'
                    },
                    'Coconut Oil': {
                        name: 'Coconut Oil',
                        desc: 'Effect on Hair: Coconut oil penetrates deep into the hair shaft, prevents protein loss, controls frizz, and gives natural softness.'
                    },
                    'Castor Oil': {
                        name: 'Castor Oil',
                        desc: 'Effect on Hair: Castor oil provides ultimate nourishment to roots, accelerates hair growth, increases thickness, and prevents split ends.'
                    }
                }
            },
            ur: {
                mainTitle: "فینگم آرگینک پروڈکٹس اینڈ ہربز",
                cat1: "بیس آئلز",
                cat2: "بیج (Seeds)",
                cat3: "جڑی بوٹیاں (Herbs)",
                products: {
                    'Mustard Oil': {
                        name: 'سرسوں کا تیل (Mustard Oil)',
                        desc: 'بالوں پر اثر: سرسوں کا تیل گہرائی تک جڑوں کو گرمائش اور غذا دیتا ہے۔ یہ خون کی گردش کو تیز کرتا ہے، بالوں کی قدرتی افزائش کرتا ہے اور خشکی (Dandruff) سے بچاتا ہے۔'
                    },
                    'Coconut Oil': {
                        name: 'ناریل کا تیل (Coconut Oil)',
                        desc: 'بالوں پر اثر: ناریل کا تیل بالوں کے اندرونی حصوں میں جذب ہو کر پروٹین کی کمی کو روکتا ہے، بالوں کو مضبوط، نرم اور چمکدار بناتا ہے۔'
                    },
                    'Castor Oil': {
                        name: 'ارنڈی کا تیل (Castor Oil)',
                        desc: 'بالوں پر اثر: ارنڈی کا تیل جڑوں کو زبردست طاقت دیتا ہے، بالوں کی موٹائی اور لمبائی میں تیز اضافہ کرتا ہے اور دو منہ والے بالوں سے بچاتا ہے۔'
                    }
                }
            },
            ar: {
                mainTitle: "فانغام منتجات عضوية وأعشاب",
                cat1: "زيوت أساسية",
                cat2: "بذور",
                cat3: "أعشاب",
                products: {
                    'Mustard Oil': { name: 'زيت الخردل', desc: 'يتحكم في تساقط الشعر ويحفز نمو بصيلات الشعر الطبيعية.' },
                    'Coconut Oil': { name: 'زيت جوز الهند', desc: 'يرطب الشعر بعمق ويمنع تلف البروتين ويحارب التجعد.' },
                    'Castor Oil': { name: 'زيت الخروع', desc: 'يعزز نمو الشعر ويقوي الجذور ويمنع تقصف الأطراف.' }
                }
            },
            hi: {
                mainTitle: "फैंगम ऑर्गेनिक उत्पाद और जड़ी-बूटियाँ",
                cat1: "बेस ऑयल्स",
                cat2: "बीज",
                cat3: "जड़ी-बूटियाँ",
                products: {
                    'Mustard Oil': { name: 'सरसों का तेल', desc: 'बालों की जड़ों को मजबूत करता है और रूसी रोकता है।' },
                    'Coconut Oil': { name: 'नारियल का तेल', desc: 'बालों में गहराई से जाकर प्रोटीन बचाता है और चमक लाता है।' },
                    'Castor Oil': { name: 'अरंडी का तेल', desc: 'बालों के विकास को तेज करता है और उन्हें घना बनाता है।' }
                }
            },
            es: {
                mainTitle: "Productos Orgánicos y Hierbas Fangam",
                cat1: "Aceites Base",
                cat2: "Semillas",
                cat3: "Hierbas",
                products: {
                    'Mustard Oil': { name: 'Aceite de Mostaza', desc: 'Estimula la circulación sanguínea y promueve el crecimiento natural del cabello.' },
                    'Coconut Oil': { name: 'Aceite de Coco', desc: 'Penetra profundamente en la hebra capilar previniendo la pérdida de proteínas.' },
                    'Castor Oil': { name: 'Aceite de Ricino', desc: 'Acelera el crecimiento del cabello, aporta grosor y previene puntas abiertas.' }
                }
            }
        };

        let defaultProducts = [
            { id: '1', category: 'base-oils', name: 'Mustard Oil', image: 'https://images.unsplash.com/photo-1608248597359-f53856cb3c0b?w=600&auto=format&fit=crop&q=80' },
            { id: '2', category: 'base-oils', name: 'Coconut Oil', image: 'https://images.unsplash.com/photo-1526947425960-945c6e72858f?w=600&auto=format&fit=crop&q=80' },
            { id: '3', category: 'base-oils', name: 'Castor Oil', image: 'https://images.unsplash.com/photo-1601049541289-9b1b7bbbfe19?w=600&auto=format&fit=crop&q=80' }
        ];

        let products = JSON.parse(localStorage.getItem('fangam_products')) || defaultProducts;

        function renderProducts() {
            ['base-oils', 'seeds', 'herbs'].forEach(cat => {
                const grid = document.getElementById(`grid-${cat}`);
                grid.innerHTML = '';
                const filtered = products.filter(p => p.category === cat);
                
                if (filtered.length === 0) {
                    grid.innerHTML = `<p style="color:#777; grid-column: 1/-1; padding: 20px; text-align:center;">No items added yet.</p>`;
                    return;
                }

                filtered.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-img-container">
                            <img src="${p.image}" alt="${p.name}">
                        </div>
                        <div class="product-content">
                            <h3 class="product-title" data-product-key="${p.name}">${p.name}</h3>
                            <p class="product-desc" data-product-desc-key="${p.name}">${p.desc || 'Effect on Hair: Natural herbal nourishment.'}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
            changeLanguage();
        }

        function changeLanguage() {
            const lang = document.getElementById('languageSelect').value;
            const bodyTag = document.getElementById('mainBody');

            if (['ur', 'ar', 'fa'].includes(lang)) {
                bodyTag.setAttribute('dir', 'rtl');
            } else {
                bodyTag.setAttribute('dir', 'ltr');
            }

            const t = translations[lang] || translations['en'];

            document.getElementById('mainTitle').innerText = t.mainTitle;
            document.getElementById('catTitle1').innerText = t.cat1;
            document.getElementById('catTitle2').innerText = t.cat2;
            document.getElementById('catTitle3').innerText = t.cat3;

            document.querySelectorAll('.product-title').forEach(el => {
                const key = el.getAttribute('data-product-key');
                if (t.products && t.products[key]) {
                    el.innerText = t.products[key].name;
                } else {
                    el.innerText = key;
                }
            });

            document.querySelectorAll('.product-desc').forEach(el => {
                const key = el.getAttribute('data-product-desc-key');
                if (t.products && t.products[key]) {
                    el.innerText = t.products[key].desc;
                }
            });
        }

        function encodeImageFileAsURL(element) {
            const file = element.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    document.getElementById('productImageBase64').value = reader.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('adminPasswordInput').focus();
        }

        function verifyPassword() {
            const pwd = document.getElementById('adminPasswordInput').value;
            if (pwd === 'fangam123' || pwd === 'admin123') {
                closeModals();
                document.getElementById('productModal').style.display = 'flex';
            } else {
                alert('Incorrect password!');
            }
        }

        function closeModals() {
            document.getElementById('passwordModal').style.display = 'none';
            document.getElementById('productModal').style.display = 'none';
        }

        function handleProductSubmit(event) {
            event.preventDefault();
            const category = document.getElementById('productCategory').value;
            const name = document.getElementById('productName').value;
            const desc = document.getElementById('productDesc').value;
            const image = document.getElementById('productImageBase64').value;

            if (!image) {
                alert('Please select an image.');
                return;
            }

            const newProduct = { id: Date.now().toString(), category, name, desc, image };
            products.push(newProduct);
            localStorage.setItem('fangam_products', JSON.stringify(products));

            document.getElementById('productForm').reset();
            closeModals();
            renderProducts();
            alert('Product added successfully!');
        }

        window.onload = function() {
            renderProducts();
        };
    </script>
</body>
</html>
