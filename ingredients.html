<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fangam Organic Products & Herbs</title>
    <!-- Official Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b4332;       
            --secondary-green: #2d6A4f;     
            --light-green: #e8f5e9;         
            --accent-gold: #d4a373;         
            --bg-color: #f4f7f4;           
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #c8d6c9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body.rtl-mode {
            direction: rtl !important;
            text-align: right !important;
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', Arial, sans-serif !important;
        }

        body.rtl-mode h1, body.rtl-mode h2, body.rtl-mode h3, 
        body.rtl-mode p, body.rtl-mode span, body.rtl-mode div, 
        body.rtl-mode .product-desc, body.rtl-mode .product-title, body.rtl-mode .category-title {
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', Arial, sans-serif !important;
            direction: rtl !important;
            text-align: right !important;
            line-height: 2.2 !important;
        }

        body.rtl-mode .product-card {
            text-align: right !important;
            direction: rtl !important;
        }

        body.ltr-mode {
            direction: ltr !important;
            text-align: left !important;
        }

        body.ltr-mode .product-card {
            text-align: left !important;
            direction: ltr !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            padding-bottom: 60px;
        }

        header {
            text-align: center;
            padding: 30px 20px 20px 20px;
            background: linear-gradient(to bottom, #d8e8dc, var(--bg-color));
            border-bottom: 3px solid var(--secondary-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .brand-logo-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--secondary-green);
            box-shadow: 0 4px 15px rgba(27,67,50,0.15);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lang-container {
            display: inline-block;
            background: #ffffff;
            padding: 5px 15px;
            border-radius: 30px;
            border: 2px solid var(--secondary-green);
            box-shadow: 0 4px 15px rgba(27,67,50,0.08);
        }

        .custom-lang-select {
            background: transparent;
            border: none;
            color: var(--primary-green);
            font-weight: 600;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            padding: 2px 6px;
            font-family: 'Poppins', sans-serif;
        }

        .goog-te-banner-frame.skiptranslate, .goog-te-gadget, .skiptranslate, .goog-tooltip { 
            display: none !important; 
        }
        
        body { top: 0px !important; position: static !important; }
        .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }

        h1 {
            font-size: 2.2rem;
            color: var(--primary-green);
            font-weight: 700;
            margin-top: 5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .category-section {
            margin-top: 45px;
        }

        .category-title {
            font-size: 1.6rem;
            color: var(--primary-green);
            border-bottom: 3px solid var(--accent-gold);
            padding-bottom: 8px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(27, 67, 50, 0.08);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(27, 67, 50, 0.15);
        }

        .product-img-container {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background-color: var(--light-green);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-content {
            padding: 22px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 1.3rem;
            color: var(--primary-green);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .product-desc {
            font-size: 1rem;
            color: #384d3b;
            white-space: pre-line;
            flex-grow: 1;
        }

        #secret-admin-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: var(--primary-green);
            border-radius: 50%;
            cursor: pointer;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(27,67,50,0.3);
        }

        #secret-admin-trigger::after {
            content: "🌿";
            font-size: 22px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: ltr !important;
            text-align: left;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--primary-green);
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn-primary { background-color: var(--primary-green); color: #fff; }
        .btn-secondary { background-color: #e2ede5; color: var(--text-color); }
        .loading-spinner { display: none; text-align: center; margin-top: 10px; color: var(--primary-green); font-weight: 600; }

        @media(max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .products-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="ltr-mode" id="mainBody">

    <header>
        <div class="brand-logo-container">
            <img src="https://lh3.googleusercontent.com/d/1vxrQpsgOFSRaTifTZ53S4zmXVgM-KBu5" alt="Fangam Organic Logo">
        </div>

        <div class="lang-container">
            <select id="customLangSelect" class="custom-lang-select" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="ur">اردو (Urdu)</option>
                <option value="ar">العربية (Arabic)</option>
                <option value="fa">فارسی (Persian)</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="zh-CN">中文 (Chinese)</option>
                <option value="es">Español (Spanish)</option>
                <option value="fr">Français (French)</option>
                <option value="de">Deutsch (German)</option>
                <option value="tr">Türkçe (Turkish)</option>
            </select>
        </div>
        
        <div id="google_translate_element" style="display:none;"></div>
        <h1>Fangam Organic Products & Herbs</h1>
    </header>

    <div class="container">
        <div class="category-section">
            <h2 class="category-title">Base Oils</h2>
            <div class="products-grid" id="grid-base-oils">
                <p style="color:#777; grid-column: 1/-1; padding: 20px; text-align:center;">Loading data...</p>
            </div>
        </div>

        <div class="category-section">
            <h2 class="category-title">Seeds</h2>
            <div class="products-grid" id="grid-seeds">
                <p style="color:#777; grid-column: 1/-1; padding: 20px; text-align:center;">Loading data...</p>
            </div>
        </div>

        <div class="category-section">
            <h2 class="category-title">Herbs</h2>
            <div class="products-grid" id="grid-herbs">
                <p style="color:#777; grid-column: 1/-1; padding: 20px; text-align:center;">Loading data...</p>
            </div>
        </div>
    </div>

    <!-- Secret Admin Trigger -->
    <div id="secret-admin-trigger" onclick="openPasswordModal()"></div>

    <!-- Password Modal -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-content" style="max-width: 380px;">
            <h2>Admin Authentication</h2>
            <div class="form-group">
                <label>Enter Admin Password</label>
                <input type="password" id="adminPasswordInput" placeholder="Password">
            </div>
            <div class="modal-btns">
                <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                <button class="btn btn-primary" onclick="verifyPassword()">Login</button>
            </div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <h2>Add New Product / Herb</h2>
            <form id="productForm" onsubmit="handleProductSubmit(event)">
                <div class="form-group">
                    <label>Category</label>
                    <select id="productCategory" required>
                        <option value="base-oils">Base Oils</option>
                        <option value="seeds">Seeds</option>
                        <option value="herbs">Herbs</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Product Name (English)</label>
                    <input type="text" id="productName" required placeholder="e.g. Coconut Oil">
                </div>
                <div class="form-group">
                    <label>Description (English)</label>
                    <textarea id="productDesc" required placeholder="Enter description in English..."></textarea>
                </div>
                <div class="form-group">
                    <label>Product Image</label>
                    <input type="file" id="productImageFile" accept="image/*" required onchange="encodeImageFileAsURL(this)">
                    <input type="hidden" id="productImageBase64">
                </div>
                <div class="loading-spinner" id="loadingSpinner">Saving to Google Sheet...</div>
                <div class="modal-btns">
                    <button type="button" class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save & Publish</button>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,ur,ar,fa,hi,zh-CN,es,fr,de,tr',
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        let products = [];

        // 👇 یہاں اپنا نیا گوگل ایپ سکرپٹ کا یو آر ایل لازمی پیسٹ کریں 👇
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxB3cURBUj5NmCYPlQ1FJPrA00BBxAEB92vHAr-6MhIYk4DG5IMJy15QrGYDVSEX8ng2A/exec';

        function fetchProductsFromSheet() {
            if (scriptURL.includes('YOUR_NEW_APPS_SCRIPT_URL_HERE')) {
                console.warn('Apps Script URL is missing!');
                return;
            }

            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        products = data;
                        renderProducts();
                    } else {
                        console.error('Invalid data format:', data);
                    }
                })
                .catch(error => {
                    console.error('Error fetching data from Google Sheet:', error);
                });
        }

        function renderProducts() {
            ['base-oils', 'seeds', 'herbs'].forEach(cat => {
                const grid = document.getElementById(`grid-${cat}`);
                grid.innerHTML = '';
                const filtered = products.filter(p => p.category === cat);
                
                if (filtered.length === 0) {
                    grid.innerHTML = `<p style="color:#777; grid-column: 1/-1; padding: 20px; text-align:center;">No items added in this category yet.</p>`;
                    return;
                }

                filtered.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-img-container">
                            <img src="${p.image}" alt="${p.name}">
                        </div>
                        <div class="product-content">
                            <h3 class="product-title">${p.name}</h3>
                            <p class="product-desc">${p.desc}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function changeLanguage(langCode) {
            const selectField = document.querySelector('.goog-te-combo');
            if (selectField) {
                selectField.value = langCode;
                selectField.dispatchEvent(new Event('change'));
            }
            
            const body = document.getElementById('mainBody');
            if (['ur', 'ar', 'fa'].includes(langCode)) {
                body.className = 'rtl-mode';
            } else {
                body.className = 'ltr-mode';
            }
        }

        window.onload = function() {
            fetchProductsFromSheet();
            
            const cookieMatch = document.cookie.match(/googtrans=\/en\/([a-z-]+)/);
            if (cookieMatch) {
                const activeLang = cookieMatch[1];
                const dropdown = document.getElementById('customLangSelect');
                if (dropdown) dropdown.value = activeLang;
                if (['ur', 'ar', 'fa'].includes(activeLang)) {
                    document.getElementById('mainBody').className = 'rtl-mode';
                }
            }
        };

        function encodeImageFileAsURL(element) {
            const file = element.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    document.getElementById('productImageBase64').value = reader.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('adminPasswordInput').focus();
        }

        function verifyPassword() {
            const pwd = document.getElementById('adminPasswordInput').value;
            if (pwd === 'fangam123' || pwd === 'admin123') {
                closeModals();
                document.getElementById('productModal').style.display = 'flex';
            } else {
                alert('Incorrect password!');
            }
        }

        function closeModals() {
            document.getElementById('passwordModal').style.display = 'none';
            document.getElementById('productModal').style.display = 'none';
        }

        function handleProductSubmit(event) {
            event.preventDefault();

            const categoryEl = document.getElementById('productCategory').value;
            const name = document.getElementById('productName').value;
            const desc = document.getElementById('productDesc').value;
            const image = document.getElementById('productImageBase64').value;

            if (!image) {
                alert('Please select an image.');
                return;
            }

            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('saveBtn').disabled = true;

            const newProduct = { 
                id: Date.now().toString(), 
                category: categoryEl, 
                name: name, 
                desc: desc, 
                image: image 
            };

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(newProduct)
            })
            .then(response => response.json())
            .then(result => {
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('saveBtn').disabled = false;
                document.getElementById('productForm').reset();
                closeModals();
                
                alert('Product successfully added and saved to Google Sheet!');
                
                products.push(newProduct);
                renderProducts();
            })
            .catch(error => {
                console.error('Error!', error);
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('saveBtn').disabled = false;
                alert('Error saving to Google Sheet. Please check your URL.');
            });
        }
    </script>
</body>
</html>
