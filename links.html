<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fangam Organic - Links</title>
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1a13; /* Dark background outer frame */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* Mobile Container matching phone screen style */
        .phone-container {
            width: 100%;
            max-width: 420px;
            background-color: #0f261c; /* Dark Organic Green Background */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            position: relative;
        }

        @media (min-width: 480px) {
            .phone-container {
                min-height: 850px;
                border-radius: 40px;
                border: 8px solid #1a382b;
                margin: 20px 0;
            }
        }

        /* Profile Logo Section */
        .profile-pic {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            margin-bottom: 15px;
            background-color: #ffffff;
        }

        .username {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 13px;
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 20px;
            padding: 0 10px;
            line-height: 1.4;
        }

        /* Social Icons Row (Top) */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 20px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .social-icons a:hover {
            opacity: 0.8;
        }

        /* Links / Buttons Container */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-button {
            width: 100%;
            background-color: #ffffff;
            color: #0f261c;
            text-align: center;
            padding: 15px 20px;
            border-radius: 30px; /* Fully rounded pill buttons */
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
        }

        .link-button:hover {
            background-color: #f1f5f9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <!-- 1. LOGO IMAGE URL: اپنے لوگو کا لنک یہاں src میں درج کریں -->
        <img src="https://lh3.googleusercontent.com/d/11kc2XGgIvXARXfCuECX3c2CiwMC8MPR2" alt="Fangam Organic Logo" class="profile-pic">
        
        <div class="username">fangamorganic</div>
        <div class="bio">Pure roots, natural care. Handcrafted herbal hair oils for real results! 🌱✨</div>

        <!-- 2. TOP SOCIAL ICONS: یہاں href میں اپنا لنک دیں، مزید بڑھانے کے لیے کوئی بھی لائن کاپی کرکے نیچے پیسٹ کر لیں -->
        <div class="social-icons">
            <a href="https://www.instagram.com/fangamorganic" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="YOUR_WHATSAPP_LINK_HERE" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="YOUR_TIKTOK_LINK_HERE" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.facebook.com/fangamorganic" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <!-- اگر مستقبل میں اور سوشل آئیکنز بڑھانے ہوں تو یہاں نئی لائن لگا سکتے ہیں -->
        </div>

        <!-- 3. ACTION BUTTONS: یہاں href میں اپنا لنک دیں، نیا بٹن بڑھانے کے لیے نیچے دی گئی آخری لائن کو کاپی کر کے نیچے مزید پیسٹ کر دیں -->
        <div class="links-container">
            <a href="https://fangamorganic-glitch.github.io/hairoil/product-details.html" class="link-button" target="_blank">Product Details</a>
            <a href="https://www.instagram.com/fangamorganic" class="link-button" target="_blank">Instagram</a>
            <a href="YOUR_TIKTOK_LINK_HERE" class="link-button" target="_blank">TikTok</a>
            <a href="YOUR_WEBSITE_LINK_HERE" class="link-button" target="_blank">Website</a>
            <a href="https://www.facebook.com/fangamorganic" class="link-button" target="_blank">Facebook</a>
            <a href="YOUR_FACEBOOK_LINK_HERE" class="link-button" target="_blank">Youtube</a>
            
            <!-- نوٹ: اگر مستقبل میں نیا بٹن بڑھانا ہو تو اس لائن کو کاپی کریں اور نیچے پیسٹ کر کے نام بدل دیں: -->
            <!-- <a href="NEW_LINK_HERE" class="link-button" target="_blank">New Button Name</a> -->
        </div>

    </div>

</body>
</html>
