  <style>
    :root {
      --primary-gold: #e5c158;
      --secondary-gold: #f3d884;
      --accent-green: #2e6f40;
      --text-light: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      /* تر و تازہ اور روشن آرگینک گرین کا خوبصورت میلان (Gradient) */
      background: linear-gradient(135deg, #183e23 0%, #225430 40%, #15381e 100%);
    }

    /* پودوں اور شاخوں کا بیک گراؤنڈ شیڈو */
    .branch-shadows {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .branch {
      position: absolute;
      background: rgba(0, 0, 0, 0.15);
      filter: blur(20px);
      border-radius: 50%;
    }

    .branch-1 {
      width: 300px;
      height: 600px;
      top: -100px;
      left: -100px;
      transform: rotate(-35deg);
    }

    .branch-2 {
      width: 350px;
      height: 700px;
      bottom: -150px;
      right: -120px;
      transform: rotate(45deg);
    }

    /* اڑتے ہوئے پتے (Floating Leaves Container) */
    .leaves-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      color: rgba(255, 255, 255, 0.25);
      animation: floatLeaf linear infinite;
    }

    @keyframes floatLeaf {
      0% {
        transform: translateY(-10vh) rotate(0deg) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(50px);
        opacity: 0;
      }
    }

    /* مین کارڈ کنٹینر (Glassmorphism Main Container) */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* برانڈ پروٹوکول اور لوگو */
    .profile-section {
      text-align: center;
      margin-bottom: 22px;
      width: 100%;
    }

    .logo-wrapper {
      width: 95px;
      height: 95px;
      margin: 0 auto 12px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--primary-gold), var(--secondary-gold));
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: #112d18;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
      margin-bottom: 4px;
    }

    .brand-tagline {
      font-size: 13px;
      color: var(--secondary-gold);
      font-weight: 500;
      letter-spacing: 0.5px;
      opacity: 0.95;
    }

    /* سوشل بٹنز کی لسٹ */
    .links-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 14.5px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .link-btn:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.2);
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* آئیکنز کے مخصوص رنگ */
    .youtube .icon-box { color: #ff4d4d; }
    .instagram .icon-box { color: #ff76b2; }
    .facebook .icon-box { color: #4292ff; }
    .tiktok .icon-box { color: #00f2fe; }
    .pinterest .icon-box { color: #e60023; }
    .whatsapp .icon-box { color: #25d366; }

    /* خاص آرڈر بٹن (Order Now Highlight) */
    .order-now {

      border: none;
      color: #0d2313;
      font-weight: 700;
      font-size: 15.5px;
      box-shadow: 0 6px 20px rgba(229, 193, 88, 0.35);
      margin-top: 4px;
    }

    .order-now .icon-box {
      background: rgba(13, 35, 19, 0.15);
      color: #0d2313;
    }

    .arrow-icon {
      font-size: 12px;
      opacity: 0.6;
    }

    /* نیچے کا فوٹر */
    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* موبائل اسکرین کی موافقت */
    @media (max-height: 700px) {
      .container { padding: 15px; }
      .profile-section { margin-bottom: 14px; }
      .logo-wrapper { width: 80px; height: 80px; margin-bottom: 8px; }
      .links-wrapper { gap: 8px; }
      .link-btn { padding: 10px 14px; font-size: 13.5px; }
    }
  </style>
</head>
<body>

  <!-- پتوں کا ڈائنامک اینیمیشن اسکرپٹ -->
  <script>
    const container = document.getElementById('leavesContainer');
    const leafIcons = ['fa-leaf', 'fa-seedling', 'fa-plant-wilt'];
    const numberOfLeaves = 18; // پتوں کی تعداد

    for (let i = 0; i < numberOfLeaves; i++) {
      const leaf = document.createElement('i');
      const randomIcon = leafIcons[Math.floor(Math.random() * leafIcons.length)];
      
      leaf.classList.add('fa-solid', randomIcon, 'leaf');
      
      // رینڈم پوزیشننگ اور سائز
      leaf.style.left = Math.random() * 100 + '%';
      leaf.style.fontSize = (Math.random() * 12 + 10) + 'px';
      leaf.style.animationDuration = (Math.random() * 8 + 6) + 's';
      leaf.style.animationDelay = (Math.random() * 5) + 's';
      
      container.appendChild(leaf);
    }
  </script>
