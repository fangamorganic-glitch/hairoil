<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fangam Organic | Official Links</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#08170F',
                            forest: '#0E271B',
                            emerald: '#163B29',
                            gold: '#D4AF37',
                            goldLight: '#F3E5AB',
                            cream: '#F7F5EE'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Cinzel"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Modern Glassmorphic and Ambient Styling */
        body {
            background-color: #08170F;
            color: #F7F5EE;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(14, 39, 27, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
        }

        .glass-button {
            background: rgba(22, 59, 41, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover, .glass-button:active {
            background: rgba(212, 175, 55, 0.18);
            border-color: rgba(212, 175, 55, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
        }

        /* Order Now Button Highlight Effect */
        .cta-gold-button {
            background: linear-gradient(135deg, #D4AF37 0%, #AA820A 100%);
            color: #08170F;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }

        .cta-gold-button:hover, .cta-gold-button:active {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 100%);
        }

        /* Background Glows */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient floating leaf animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.5; }
            50% { transform: translateY(-18px) rotate(8deg); opacity: 0.8; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.5; }
        }

        .floating-leaf {
            animation: float 7s ease-in-out infinite;
        }

        .floating-leaf-delayed {
            animation: float 9s ease-in-out 3s infinite;
        }

        /* Luxury Gold Shimmer Effect */
        .gold-shimmer {
            background: linear-gradient(90deg, #D4AF37 0%, #FFF3B0 50%, #D4AF37 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-5 relative selection:bg-brand-gold selection:text-brand-dark">

    <!-- Ambient Glowing Background Bubbles -->
    <div class="ambient-glow w-80 h-80 bg-emerald-900/40 -top-12 -left-12"></div>
    <div class="ambient-glow w-96 h-96 bg-yellow-900/25 -bottom-20 -right-20"></div>
    <div class="ambient-glow w-80 h-80 bg-green-950/70 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

    <!-- Floating Background Leaves -->
    <div class="fixed top-10 left-6 text-brand-gold/15 text-6xl floating-leaf pointer-events-none select-none">
        <i class="fa-solid fa-leaf"></i>
    </div>
    <div class="fixed bottom-12 right-6 text-brand-gold/15 text-7xl floating-leaf-delayed pointer-events-none select-none">
        <i class="fa-solid fa-seedling"></i>
    </div>
    <div class="fixed top-1/2 right-8 text-emerald-500/10 text-5xl floating-leaf pointer-events-none select-none">
        <i class="fa-solid fa-spa"></i>
    </div>
    <div class="fixed bottom-1/3 left-6 text-emerald-500/10 text-5xl floating-leaf-delayed pointer-events-none select-none">
        <i class="fa-solid fa-droplet"></i>
    </div>

    <!-- Main Container Card -->
    <div class="w-full max-w-md glass-card rounded-3xl p-5 sm:p-6 relative z-10 flex flex-col justify-between my-auto border border-brand-gold/30">
        
        <!-- Header Tag -->
        <div class="flex justify-center items-center mb-3">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-forest/80 border border-brand-gold/30 text-[11px] text-brand-goldLight tracking-wider uppercase font-semibold">
                <i class="fa-solid fa-shield-halved text-brand-gold"></i>
                <span>100% Pure & Organic Care</span>
            </div>
        </div>

        <!-- Brand Header Section -->
        <div class="text-center mb-4">
            
            <!-- Logo Holder -->
            <!-- 
                =======================================================================
                لوگو تبدیل کرنے کے لیے نیچے دیے گئے src="..." میں اپنی تصویر کا URL ڈالیں
                =======================================================================
            -->
            <div class="relative w-24 h-24 mx-auto mb-2.5 group">
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-brand-gold to-emerald-600 blur-sm opacity-60 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative w-full h-full rounded-full bg-brand-forest border-2 border-brand-gold overflow-hidden p-1 flex items-center justify-center">
                    
                    <!-- اگر آپ کے پاس لوگو کا URL ہو تو نیچے والے img ٹیگ میں src کی جگہ ڈال دیں -->
                    <img id="logoImg" 
                         src="https://placehold.co/150x150/0E271B/D4AF37?text=Fangam+Organic" 
                         alt="Fangam Organic" 
                         class="w-full h-full object-cover rounded-full" 
                         onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
                    
                    <!-- Fallback Icon if Image doesn't load -->
                    <div id="logoFallback" class="hidden flex-col items-center justify-center text-brand-gold">
                        <i class="fa-solid fa-leaf text-3xl"></i>
                        <span class="text-[9px] font-bold tracking-tighter mt-0.5">FANGAM</span>
                    </div>
                </div>
            </div>

            <!-- Brand Title & Description -->
            <h1 class="text-2xl font-bold font-serif gold-shimmer tracking-wider mb-0.5">FANGAM ORGANIC</h1>
            <p class="text-[12px] text-brand-goldLight font-medium tracking-wide">Pure Herbal Shampoos, Soaps & Hair Care</p>
        </div>

        <!-- 7 Social & Business Link Buttons Container -->
        <div class="space-y-2 mb-4">

            <!-- 1. YOUTUBE LINK -->
            <!-- ========================================================= -->
            <!-- یہاں href="..." کی جگہ اپنا یوٹیوب چینل لنک ڈالیں -->
            <!-- ========================================================= -->
            <a href="https://youtube.com/@fangamorganic" target="_blank" rel="noopener noreferrer" class="glass-button w-full py-2.5 px-4 rounded-xl flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-brand-forest border border-brand-gold/30 flex items-center justify-center text-red-500 text-base group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                    <span class="text-xs font-semibold text-white tracking-wide group-hover:text-brand-gold transition-colors">YouTube Channel</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-brand-gold/50 group-hover:text-brand-gold"></i>
            </a>

            <!-- 2. INSTAGRAM LINK -->
            <!-- ========================================================= -->
            <!-- یہاں href="..." کی جگہ اپنا انسٹاگرام پیج لنک ڈالیں -->
            <!-- ========================================================= -->
            <a href="https://instagram.com/fangamorganic" target="_blank" rel="noopener noreferrer" class="glass-button w-full py-2.5 px-4 rounded-xl flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-brand-forest border border-brand-gold/30 flex items-center justify-center text-pink-400 text-base group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <span class="text-xs font-semibold text-white tracking-wide group-hover:text-brand-gold transition-colors">Instagram Profile</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-brand-gold/50 group-hover:text-brand-gold"></i>
            </a>

            <!-- 3. FACEBOOK LINK -->
            <!-- ========================================================= -->
            <!-- یہاں href="..." کی جگہ اپنا فیس بک پیج لنک ڈالیں -->
            <!-- ========================================================= -->
            <a href="https://facebook.com/fangamorganic" target="_blank" rel="noopener noreferrer" class="glass-button w-full py-2.5 px-4 rounded-xl flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-brand-forest border border-brand-gold/30 flex items-center justify-center text-blue-400 text-base group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-facebook-f"></i>
                    </div>
                    <span class="text-xs font-semibold text-white tracking-wide group-hover:text-brand-gold transition-colors">Facebook Page</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-brand-gold/50 group-hover:text-brand-gold"></i>
            </a>

            <!-- 4. TIKTOK LINK -->
            <!-- ========================================================= -->
            <!-- یہاں href="..." کی جگہ اپنا ٹک ٹاک لنک ڈالیں -->
            <!-- ========================================================= -->
            <a href="https://tiktok.com/@fangamorganic" target="_blank" rel="noopener noreferrer" class="glass-button w-full py-2.5 px-4 rounded-xl flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-brand-forest border border-brand-gold/30 flex items-center justify-center text-white text-base group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <span class="text-xs font-semibold text-white tracking-wide group-hover:text-brand-gold transition-colors">TikTok Account</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-brand-gold/50 group-hover:text-brand-gold"></i>
            </a>

            <!-- 5. PINTEREST LINK -->
            <!-- ========================================================= -->
            <!-- یہاں href="..." کی جگہ اپنا پنٹرسٹ لنک ڈالیں -->
            <!-- ========================================================= -->
            <a href="https://pinterest.com/fangamorganic" target="_blank" rel="noopener noreferrer" class="glass-button w-full py-2.5 px-4 rounded-xl flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-brand-forest border border-brand-gold/30 flex items-center justify-center text-red-400 text-base group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-pinterest-p"></i>
                    </div>
                    <span class="text-xs font-semibold text-white tracking-wide group-hover:text-brand-gold transition-colors">Pinterest Board</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-brand-gold/50 group-hover:text-brand-gold"></i>
            </a>

            <!-- 6. WHATSAPP CHANNEL LINK -->
            <!-- ========================================================= -->
            <!-- یہاں href="..." کی جگہ اپنا واٹس ایپ **چینل** کا لنک ڈالیں -->
            <!-- ========================================================= -->
            <a href="https://whatsapp.com/channel/0029Va0000000000000000" target="_blank" rel="noopener noreferrer" class="glass-button w-full py-2.5 px-4 rounded-xl flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-brand-forest border border-brand-gold/30 flex items-center justify-center text-emerald-400 text-base group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <span class="text-xs font-semibold text-white tracking-wide group-hover:text-brand-gold transition-colors">WhatsApp Channel</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-brand-gold/50 group-hover:text-brand-gold"></i>
            </a>

            <!-- 7. ORDER NOW (PRIMARY CTA) LINK -->
            <!-- ========================================================= -->
            <!-- یہاں href="..." کی جگہ اپنا Direct WhatsApp Chat یا Website Order لنک ڈالیں -->
            <!-- مثال کے طور پر: https://wa.me/923001234567?text=Hello%20I%20want%20to%20order -->
            <!-- ========================================================= -->
            <a href="https://wa.me/923000000000?text=Hi%20Fangam%20Organic,%20I%20want%20to%20place%20an%20order" target="_blank" rel="noopener noreferrer" class="cta-gold-button w-full py-3 px-4 rounded-xl flex items-center justify-between group font-bold mt-1">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-brand-dark/20 flex items-center justify-center text-brand-dark text-base group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </div>
                    <span class="text-xs tracking-wider uppercase font-extrabold text-brand-dark">ORDER NOW</span>
                </div>
                <div class="flex items-center gap-1.5 text-brand-dark text-xs font-bold">
                    <span>Direct Shop</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

        </div>

        <!-- Copy/Share Link Action & Footer -->
        <div class="pt-3 border-t border-brand-gold/20 flex flex-col items-center gap-2">
            
            <button onclick="shareOrCopyLink()" class="px-4 py-1.5 rounded-full bg-brand-forest/60 border border-brand-gold/20 text-brand-goldLight text-[11px] hover:text-brand-gold flex items-center gap-2 transition-colors">
                <i class="fa-solid fa-share-nodes"></i>
                <span>Share Profile Link</span>
            </button>

            <p class="text-[10px] text-gray-400/80 flex items-center justify-center gap-1 mt-1">
                <span>&copy; <span id="year"></span> Fangam Organic. All Rights Reserved.</span>
            </p>
        </div>

    </div>

    <!-- Notification Alert for Link Copy -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-brand-gold text-brand-dark px-4 py-2 rounded-full font-bold text-xs shadow-xl items-center gap-2 z-50">
        <i class="fa-solid fa-check-circle"></i>
        <span>Link copied to clipboard!</span>
    </div>

    <script>
        // Set dynamic current year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Share or Copy Functionality
        function shareOrCopyLink() {
            if (navigator.share) {
                navigator.share({
                    title: 'Fangam Organic',
                    text: 'Fangam Organic Official Bio Links',
                    url: window.location.href,
                }).catch(() => {
                    copyToClipboard();
                });
            } else {
                copyToClipboard();
            }
        }

        function copyToClipboard() {
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 2500);
        }
    </script>
</body>
</html>
