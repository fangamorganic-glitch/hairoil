<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fangam Organic - Links</title>
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b141a; /* Dark background matching the image */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* Mobile Container to look like a phone screen on both PC and mobile */
        .phone-container {
            width: 100%;
            max-width: 420px;
            background-color: #0e1921;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        @media (min-width: 480px) {
            .phone-container {
                min-height: 850px;
                border-radius: 40px;
                border: 8px solid #222;
                margin: 20px 0;
            }
        }

        /* Profile Section */
        .profile-pic {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            margin-bottom: 15px;
            background-color: #fff;
        }

        .username {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 13px;
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 20px;
            padding: 0 10px;
            line-height: 1.4;
        }

        /* Social Icons Row */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 20px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .social-icons a:hover {
            opacity: 0.8;
        }

        /* Links / Buttons */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-button {
            width: 100%;
            background-color: #ffffff;
            color: #0b141a;
            text-align: center;
            padding: 15px 20px;
            border-radius: 30px; /* Fully rounded pill buttons */
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
        }

        .link-button:hover {
            background-color: #f1f5f9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Logo / Profile Image (آپ یہاں اپنے لوگو کا لنک یا فائل نام دے سکتے ہیں) -->
        <img src="https://via.placeholder.com/90" alt="Fangam Organic Logo" class="profile-pic">
        
        <div class="username">fangamorganic</div>
        <div class="bio">Pure roots, natural care. Handcrafted herbal hair oils for real results! 🌱✨</div>

        <!-- Social Media Icons Top Bar -->
        <div class="social-icons">
            <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://whatsapp.com" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="https://tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
        </div>

        <!-- 5 Action Buttons (جیسا کہ تصویر میں ہیں) -->
        <div class="links-container">
            <a href="#" class="link-button" target="_blank">Product Details</a>
            <a href="#" class="link-button" target="_blank">Instagram</a>
            <a href="#" class="link-button" target="_blank">TikTok</a>
            <a href="#" class="link-button" target="_blank">Website</a>
            <a href="#" class="link-button" target="_blank">Facebook</a>
        </div>
    </div>

</body>
</html>
